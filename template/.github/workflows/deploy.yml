name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    # The whole recipe lives in site-kit so it is fixed in one place for every
    # site. Before that there were five near-identical copies of it, kept in
    # sync by hand.
    uses: gfrmin/site-kit/.github/workflows/worker-deploy.yml@master
    with:
      build: npm run build
      test: npm test
    secrets: inherit
