name: tests

# site-kit holds the deploy recipe for every site on the account, so a break
# here breaks all of them at once. The suite is ~1s and needs no credentials,
# no network and no Cloudflare account.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Must match the default `node` input of worker-deploy.yml — if the
          # fleet pin moves, this moves with it or the suite stops proving
          # anything about what the sites actually run.
          node-version: "24"

      - run: npm test

      # The template is what every new site starts from, so a template that does
      # not build is a broken `new-site`. This catches it here rather than in
      # someone's first five minutes with a new repo.
      - name: The template scaffolds, builds and passes its own tests
        run: |
          set -euo pipefail
          # new-site makes a real initial commit, and a bare runner has no git
          # identity. Configuring it here rather than teaching the script to skip
          # the commit: on a real machine an absent identity is a genuine problem
          # and should stop the scaffold, not be worked around.
          git config --global user.email ci@example.invalid
          git config --global user.name "site-kit CI"
          ./bin/new-site smoketest smoketest.example.com --dry-run --dir /tmp/smoketest
          test -z "$(grep -rl '{{' /tmp/smoketest --exclude-dir=.git || true)" \
            || { echo "::error::unsubstituted {{placeholders}} left in the scaffold"; exit 1; }
          cd /tmp/smoketest
          npm install --no-audit --no-fund
          npm run build
          npm test
          npx wrangler deploy --dry-run

      # The scaffolded site must be *born* gated: the guard is worth nothing if
      # a new repo has to remember to opt in. Asserted against the generated
      # workflow rather than the template, so a substitution that mangles it is
      # caught too.
      - name: A scaffolded site ships with the analytics gate wired
        run: |
          set -euo pipefail
          workflow=/tmp/smoketest/.github/workflows/deploy.yml
          grep -q 'require-vars: VITE_POSTHOG_KEY' "$workflow" \
            || { echo "::error::the scaffold lost its require-vars gate"; exit 1; }
          grep -q 'build-must-match:' "$workflow" \
            || { echo "::error::the scaffold lost its build-must-match gate"; exit 1; }
          # And the build it just ran must NOT satisfy that gate, because no key
          # was set — proving the guard would actually fire on a dark site
          # rather than passing vacuously.
          if grep -rEq 'phc_[A-Za-z0-9]{20,}' /tmp/smoketest/dist; then
            echo "::error::an unkeyed build matched the analytics pattern — the gate proves nothing"
            exit 1
          fi
          echo "ok: gate present, and an unkeyed build does not satisfy it"

      - name: --no-analytics removes the gate and still builds
        run: |
          set -euo pipefail
          ./bin/new-site nogate nogate.example.com --dry-run --no-analytics --dir /tmp/nogate
          workflow=/tmp/nogate/.github/workflows/deploy.yml
          ! grep -qE '^\s*(require-vars|build-must-match):' "$workflow" \
            || { echo "::error::--no-analytics left the gate in place"; exit 1; }
          grep -q 'secrets: inherit' "$workflow" \
            || { echo "::error::--no-analytics ate more than the gate"; exit 1; }
          cd /tmp/nogate && npm install --no-audit --no-fund && npm run build

      # The output check and the default headers, run from THIS checkout
      # (./.github/actions/...), because worker-deploy.yml calls them @master and
      # a PR must prove its own version before it becomes master. Each case runs
      # on the template's real build, copied into the workspace (the link check
      # resolves root-relative links against github.workspace).
      - name: Stage the template's build for the output-check cases
        run: |
          set -euo pipefail
          mkdir -p _check
          cp -r /tmp/smoketest/dist _check/good
          cp -r /tmp/smoketest/dist _check/broken
          # A link to a page the build never produced: the check must refuse it.
          sed -i 's#</body>#<a href="/no-such-page/">x</a></body>#' _check/broken/index.html
          grep -q 'no-such-page' _check/broken/index.html

      - name: "Output check: a whole build passes"
        uses: ./.github/actions/check-build-output
        with:
          dir: _check/good
          expect: "<title>"

      - name: "Output check: a broken internal link fails"
        id: broken
        continue-on-error: true
        uses: ./.github/actions/check-build-output
        with:
          dir: _check/broken

      - name: "Output check: a home page without the expected text fails"
        id: wrong
        continue-on-error: true
        uses: ./.github/actions/check-build-output
        with:
          dir: _check/good
          expect: "this string is in no page anywhere"
          check-links: "false"

      - name: Both failure cases did fail
        env:
          BROKEN: ${{ steps.broken.outcome }}
          WRONG: ${{ steps.wrong.outcome }}
        run: |
          set -euo pipefail
          [ "$BROKEN" = failure ] || { echo "::error::a link to /no-such-page/ passed the output check ($BROKEN)"; exit 1; }
          [ "$WRONG" = failure ] || { echo "::error::a missing expect string passed the output check ($WRONG)"; exit 1; }
          echo "ok: both seeded defects were refused"

      - name: "Default headers: written once, and a site's own value kept"
        uses: ./.github/actions/default-headers
        with:
          dir: _check/good

      - name: The headers file says what it should
        run: |
          set -euo pipefail
          f=_check/good/_headers
          for h in "X-Content-Type-Options: nosniff" "X-Frame-Options: SAMEORIGIN" "Referrer-Policy: strict-origin-when-cross-origin" "Content-Security-Policy: frame-ancestors 'self'; base-uri 'self'; object-src 'none'"; do
            grep -qF "  $h" "$f" || { echo "::error::$f lacks $h"; cat "$f"; exit 1; }
          done
          mkdir -p _check/own && printf '/*\n  X-Frame-Options: DENY\n' > _check/own/_headers
          echo "ok: baseline written"

      - name: "Default headers: a site's own X-Frame-Options is not doubled"
        uses: ./.github/actions/default-headers
        with:
          dir: _check/own

      - name: The site's DENY stands alone
        run: |
          set -euo pipefail
          n=$(grep -ci 'X-Frame-Options' _check/own/_headers)
          [ "$n" = 1 ] && grep -q 'DENY' _check/own/_headers \
            || { echo "::error::X-Frame-Options appears $n times"; cat _check/own/_headers; exit 1; }
          grep -q 'nosniff' _check/own/_headers || { echo "::error::nosniff missing"; exit 1; }
          echo "ok: the site's value kept, the rest added"
